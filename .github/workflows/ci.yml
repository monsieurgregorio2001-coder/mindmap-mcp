name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm rebuild better-sqlite3
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run verify:mcp
      - name: Evidence
        if: matrix.node-version == 22
        run: |
          npm run evidence
          npm run evidence:check
      - name: Upload evidence.json
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: evidence
          path: dist/evidence.json
  demo:
    # The receipt is built from the evidence the Node 22 test leg uploads.
    needs: test
    runs-on: ubuntu-24.04
    env:
      HOUSE_DIR: ${{ github.workspace }}/hub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: monsieurgregorio2001-coder/monsieurgregorio2001-coder.github.io
          ref: 6b2ee826c1fc654373dd9952ba70732e923a8bbf
          path: hub
      - uses: actions/download-artifact@v4
        with:
          name: evidence
          path: dist
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci
        working-directory: demo
      - run: npm run typecheck
        working-directory: demo
      - run: npm run house:check
        working-directory: demo
      - name: Build the demo
        working-directory: demo
        shell: bash
        run: |
          set -o pipefail
          # Last lines go to an annotation, so a failure can be read through the API.
          npm run build 2>&1 | tee build.log || { tail -n 15 build.log | tr '\n' ' ' | sed 's/^/::error title=demo build::/'; echo; exit 1; }
